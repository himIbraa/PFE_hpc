[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "akn-rlm"
version = "0.1.0"
description = "Recursive-Language-Model legal IR for AlgerianLegalBench v3.0"
requires-python = ">=3.10"
dependencies = [
    "lxml>=5.0",
    "rdflib>=7.0",
    "langchain>=0.2",
    "langgraph>=0.1",
    "openai>=1.30",
    "anthropic>=0.28",
    "faiss-cpu>=1.8",
    "scipy>=1.11",
    "rank-bm25>=0.2.2",
    "transformers>=4.47,<5.0",
    "torch>=2.2",
    "sentence-transformers>=3.0",
    "FlagEmbedding>=1.2",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "click>=8.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
akn-rlm = "akn_rlm.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["akn_rlm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.setuptools.package-data]
"akn_rlm.rlm.prompts" = ["*.txt", "*.json"]
